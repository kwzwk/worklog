name: Build worklog.exe

on:
  push:
    branches: ["**"]
    paths:
      - "worklog.py"
      - ".github/workflows/build-exe.yml"
  pull_request:
    paths:
      - "worklog.py"
      - ".github/workflows/build-exe.yml"
  # Publishing a GitHub Release (any tag name) builds the exe and attaches it.
  release:
    types: [published]
  # Run manually; give a release's tag to (re)attach the exe to that release.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the exe to (leave empty to just build)"
        required: false
        default: ""

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller and dependencies
        run: python -m pip install --upgrade pip pyinstaller pystray pillow openpyxl

      # --noconsole: it's a tray app with pop-ups, so no console window.
      # pystray picks its backend at runtime, so name the Windows one.
      - name: Build exe
        run: pyinstaller --onefile --noconsole --hidden-import pystray._win32 --name worklog worklog.py

      - uses: actions/upload-artifact@v4
        with:
          name: worklog-exe
          path: dist/worklog.exe
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'release' || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write      # attach files to the release
      id-token: write      # sign the build attestation
      attestations: write  # store the build attestation
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: worklog-exe

      - name: Write checksum
        run: sha256sum worklog.exe > worklog.exe.sha256

      # Signed record that this exe was built by this workflow from this
      # commit. Check it with: gh attestation verify worklog.exe -R kwzwk/worklog
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: worklog.exe

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          overwrite_files: true
          files: |
            worklog.exe
            worklog.exe.sha256
