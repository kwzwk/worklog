name: Build worklog.exe

on:
  push:
    branches: ["**"]
    # Pushing a tag like v1.0.0 builds the exe and publishes a GitHub Release.
    # (Path filters don't apply to tag pushes, so every v* tag releases.)
    tags: ["v*"]
    paths:
      - "worklog.py"
      - ".github/workflows/build-exe.yml"
  pull_request:
    paths:
      - "worklog.py"
      - ".github/workflows/build-exe.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      # --console: the tool needs its console window to ask questions.
      - name: Build exe
        run: pyinstaller --onefile --console --name worklog worklog.py

      - uses: actions/upload-artifact@v4
        with:
          name: worklog-exe
          path: dist/worklog.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release
      id-token: write      # sign the build attestation
      attestations: write  # store the build attestation
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: worklog-exe

      - name: Write checksum
        run: sha256sum worklog.exe > worklog.exe.sha256

      # Signed record that this exe was built by this workflow from this
      # commit. Check it with: gh attestation verify worklog.exe -R kwzwk/worklog
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: worklog.exe

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            worklog.exe
            worklog.exe.sha256
          generate_release_notes: true
